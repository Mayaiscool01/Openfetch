name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked
      - name: Lint for this platform
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Show what it detects here
        run: |
          cargo run --locked -q -- --noip --ascii
          cargo run --locked -q -- --noip --json
      - name: Check network detection (prints no addresses)
        run: |
          cargo run --locked -q -- --json > full.json
          python3 -c "import json; n=json.load(open('full.json'))['network']; print('primary:', n['primary'], '| local ip found:', bool(n['local_ip']), '| interfaces:', [(i['name'], i['up'], len(i['addresses'])) for i in n['interfaces']])"
